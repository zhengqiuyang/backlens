<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BackLens gradient flow timeline</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9;
          --dim:#8b949e; --blue:#58a6ff; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace, Consolas, monospace; }
  header { padding:16px 20px 4px; }
  h1 { margin:0; font-size:18px; } h1 .lens { color:var(--blue); }
  #meta { color:var(--dim); margin-top:2px; }
  .card { background:var(--panel); border:1px solid var(--border);
          border-radius:8px; padding:12px 16px; margin:14px 20px; }
  svg { display:block; width:100%; }
  table { border-collapse:collapse; margin-top:6px; font-size:12.5px; }
  th, td { text-align:left; padding:4px 10px; }
  th { color:var(--dim); font-weight:500; }
  footer { padding:8px 20px; color:var(--dim); font-size:12px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px;
        margin-right:6px; }
</style>
</head>
<body>
<header>
  <h1><span class="lens">BackLens</span> gradient flow over training</h1>
  <div id="meta"></div>
</header>
<div class="card"><div id="chart"></div>
  <table id="legend"></table>
</div>
<footer>generated by <code>GradientFlowTimeline.save_html</code> &mdash; single file, zero dependencies</footer>
<script>
const DATA = {"title": "gradient flow over training", "names": ["Linear(32,3).W", "Linear(2,32).W", "Linear(32,32).W", "Linear(2,32).b", "Linear(32,3).b", "Linear(32,32).b"], "steps": [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200], "matrix": [[32.12419327765885, 13.466172880313723, 46.108860495678925, 3.979805272605736, 1.6803973242824604, 2.6405707494602937], [33.905034918735076, 9.255935760551667, 18.738310270265796, 21.566805777751668, 8.540273739990376, 7.993639532705419], [24.824370766269475, 17.398552853277316, 27.37482643488235, 21.480402319998372, 2.7506797947482085, 6.171167830824274], [22.487957078552007, 11.61073282451439, 15.797050363126466, 40.743373737664854, 2.614864875847596, 6.746021120294682], [25.04912696556605, 12.81057188499265, 16.90675507896557, 33.82547859923062, 3.918340079205386, 7.489727392039727], [34.243289596297345, 13.837126225380453, 15.563022845962106, 31.09222869004283, 1.1692187926665494, 4.095113849650721], [47.54688726391709, 16.366806634574814, 17.014231165057147, 13.966038805323882, 2.1021524575566954, 3.003883673570379], [48.09190453325755, 17.95737325313207, 16.442283063228874, 12.602521699360917, 1.7683625221352655, 3.137554928885323], [48.841553069875594, 18.506210894393377, 17.1152291831596, 10.268821923888005, 2.4616116401580763, 2.80657328852534], [48.986149695533825, 18.97330094492152, 17.234230739854027, 9.86696748122194, 2.4109322780414124, 2.528418860427284], [49.15345566369641, 19.347751808276634, 17.39415099787936, 9.333208781550804, 2.412954507253089, 2.3584782413437115]]};
const PALETTE = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff',
                 '#39c5cf','#ff7b72','#7ee2a8','#ffa657','#79c0ff'];
document.getElementById('meta').textContent =
  `${DATA.title}  ·  ${DATA.names.length} parameters  ·  ${DATA.steps.length} snapshots`;

const W = 1000, H = 320, PADL = 46, PADB = 26, PADT = 10;
const maxStep = Math.max(...DATA.steps, 1);
const xOf = i => PADL + (i / Math.max(1, DATA.steps.length - 1)) * (W - PADL - 14);
const yOf = pct => PADT + (1 - pct / 100) * (H - PADT - PADB);

const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(svgNS, 'svg');
svg.setAttribute('viewBox', `0 0 ${W} ${H + PADB}`);
// y grid at 0/50/100
[0, 50, 100].forEach(p => {
  const ln = document.createElementNS(svgNS, 'line');
  ln.setAttribute('x1', PADL); ln.setAttribute('x2', W - 14);
  ln.setAttribute('y1', yOf(p)); ln.setAttribute('y2', yOf(p));
  ln.setAttribute('stroke', '#21262d');
  svg.appendChild(ln);
  const t = document.createElementNS(svgNS, 'text');
  t.setAttribute('x', 8); t.setAttribute('y', yOf(p) + 4);
  t.setAttribute('fill', '#8b949e'); t.setAttribute('font-size', '11');
  t.textContent = p + '%';
  svg.appendChild(t);
});
// stacked areas (cumulative shares)
const cum = new Array(DATA.steps.length).fill(0);
DATA.names.forEach((name, pi) => {
  const top = [], bot = [];
  DATA.steps.forEach((_, i) => {
    bot.push([xOf(i), yOf(cum[i])]);
    cum[i] += DATA.matrix[i][pi] || 0;
    top.push([xOf(i), yOf(cum[i])]);
  });
  const d = 'M ' + top.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ')
    + ' L ' + bot.reverse().map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ') + ' Z';
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', PALETTE[pi % PALETTE.length]);
  path.setAttribute('fill-opacity', '0.75');
  svg.appendChild(path);
});
document.getElementById('chart').appendChild(svg);

const legend = document.getElementById('legend');
let row = null;
DATA.names.forEach((name, pi) => {
  if (pi % 3 === 0) { row = document.createElement('tr'); legend.appendChild(row); }
  const first = DATA.matrix[0][pi], last = DATA.matrix[DATA.matrix.length - 1][pi];
  const td = document.createElement('td');
  td.innerHTML = `<span class="sw" style="background:${PALETTE[pi % PALETTE.length]}"></span>` +
    `${name} &nbsp; ${first.toFixed(1)}% -> ${last.toFixed(1)}%`;
  row.appendChild(td);
});
</script>
</body>
</html>
