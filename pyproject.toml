[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradlens"
version = "0.5.0"
description = "A numpy autograd engine with X-ray vision into backpropagation: step-through backward debugging, NaN tracing, gradcheck, Mermaid graphs, an animated backward-pass player, training gradient audits, gradient-flow maps, autodiff puzzles, and bidirectional ONNX interop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GradLens contributors" }]
keywords = [
    "autograd", "automatic-differentiation", "deep-learning", "education",
    "backpropagation", "debugging", "numpy", "micrograd", "onnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "micrograd"]
onnx = ["onnx>=1.14", "onnxruntime>=1.16"]

[project.urls]
Homepage = "https://github.com/zhengqiuyang/gradlens"
"Source" = "https://github.com/zhengqiuyang/gradlens"

[tool.setuptools.packages.find]
include = ["gradlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
